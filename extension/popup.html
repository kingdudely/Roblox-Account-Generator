<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roblox Alt Creator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d11;
        --line: #1e2733;
        --text: #e7ecf3;
        --muted: #8792a2;
        --accent: #7c9cff;
        --mint: #5fe3a1;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .mark {
        width: 26px; height: 26px; border-radius: 8px;
        background: radial-gradient(circle at 30% 25%, #a9bdff, #6d88e8 45%, #2c3b6b);
        position: relative;
      }
      .mark::after {
        content: ""; position: absolute; inset: 7px; border-radius: 3px;
        border: 2px solid rgba(255,255,255,.85);
        border-right-color: transparent; border-bottom-color: transparent;
        transform: rotate(-45deg);
      }
      h1 { margin: 0; font-size: 14px; font-weight: 620; }
      .stats {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
        margin-bottom: 12px;
      }
      .stat {
        border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
        background: #10151b;
      }
      .stat b { display: block; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .stat span { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
      button {
        width: 100%; padding: 10px 14px; border-radius: 9px; cursor: pointer;
        border: 1px solid #6d88e6; color: #fff; font: inherit; font-weight: 570;
        background: linear-gradient(180deg, #6f8cf2, #5573dd);
      }
      button.ghost {
        margin-top: 7px; background: transparent; border-color: var(--line);
        color: var(--muted); font-weight: 500;
      }
      .state { margin: 10px 0 0; color: var(--muted); font-size: 11.5px; }
      .state b { color: var(--mint); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark"></span>
      <h1>Roblox Alt Creator</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="accounts">0</b><span>accounts</span></div>
      <div class="stat"><b id="keys">0</b><span>keys</span></div>
      <div class="stat"><b id="seats">0</b><span>seats</span></div>
    </div>
    <button id="open">Open runner</button>
    <button id="keys-tab" class="ghost">Add a key</button>
    <p class="state" id="state">idle</p>
    <script src="popup.js"></script>
  </body>
</html>
