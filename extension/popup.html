<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roblox Alt Creator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1d1418;
        --panel: #33262e;
        --well: #150d12;
        --text: #ece3da;
        --muted: #b3a29b;
        --muted-2: #8b7a76;
        --accent: #e95420;
        --mint: #8fc97a;
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 12px;
        color: var(--text);
        font: 13px/1.45 "Ubuntu", Cantarell, "Droid Sans", "Liberation Sans", "DejaVu Sans", sans-serif;
        background-color: var(--bg);
        background-image:
          radial-gradient(360px 220px at 15% -10%, rgba(233, 84, 32, 0.16), transparent 65%),
          linear-gradient(180deg, #221820, #170f14);
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
      .mark {
        width: 26px; height: 26px; border-radius: 50%;
        background: radial-gradient(circle at 34% 26%, #ffb181, #f0713f 28%, #d04715 58%, #7d2409);
        box-shadow: inset 0 1px 1px rgba(255,255,255,.6), inset 0 -3px 6px rgba(0,0,0,.5),
          0 2px 4px -1px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.55);
        position: relative;
      }
      .mark::after {
        content: ""; position: absolute; inset: 7px; border-radius: 3px;
        border: 2px solid rgba(255,246,240,.9);
        border-right-color: transparent; border-bottom-color: transparent;
        transform: rotate(-45deg);
      }
      h1 { margin: 0; font-size: 14px; font-weight: 700; text-shadow: 0 1px 0 #000; }
      .stats {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
        margin-bottom: 11px;
      }
      .stat {
        border: 1px solid #0e080c; border-radius: 6px; padding: 7px 9px;
        background: linear-gradient(180deg, #382a32, #2b2027);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.11);
      }
      .stat b {
        display: block; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums;
        color: #fff2e8; text-shadow: 0 1px 0 #000;
      }
      .stat span {
        color: var(--muted-2); font-size: 9px; text-transform: uppercase; letter-spacing: .1em;
      }
      button {
        width: 100%; padding: 9px 13px; border-radius: 6px; cursor: pointer;
        border: 1px solid #4a1a05; color: #fff8f3; font: inherit; font-weight: 600;
        text-shadow: 0 1px 0 rgba(90,26,2,.75);
        background: linear-gradient(180deg, #f5813f, #e05a1e 46%, #bc3b0c);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 1px 3px rgba(0,0,0,.6);
      }
      button:active { transform: translateY(1px); }
      button.ghost {
        margin-top: 6px; color: var(--muted); font-weight: 500; text-shadow: none;
        border-color: #0e080c;
        background: linear-gradient(180deg, rgba(70,52,60,.55), rgba(40,30,36,.55));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
      }
      .state { margin: 9px 0 0; color: var(--muted); font-size: 11px; }
      .state b { color: var(--mint); font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="mark"></span>
      <h1>Roblox Alt Creator</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="accounts">0</b><span>accounts</span></div>
      <div class="stat"><b id="keys">0</b><span>keys</span></div>
      <div class="stat"><b id="seats">0</b><span>seats</span></div>
    </div>
    <button id="open">Open runner</button>
    <button id="keys-tab" class="ghost">Add a key</button>
    <p class="state" id="state">idle</p>
    <script src="popup.js"></script>
  </body>
</html>
